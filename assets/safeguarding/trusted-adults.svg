<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Cercul adulților de încredere</title>
  <desc id="desc">Copilul este în centru și poate alege minimum doi adulți și un canal oficial. Dacă primul nu ajută, poate merge la următorul.</desc>
  <rect width="720" height="480" fill="#fff"/>
  <g font-family="Arial, sans-serif" stroke="#111" stroke-width="2" fill="#fff">
    <text x="25" y="35" font-size="22" font-weight="700" fill="#111" stroke="none">Adulții mei de încredere — versiunea 1.0</text>
    <circle cx="360" cy="240" r="70"/><text x="332" y="247" font-size="20" fill="#111" stroke="none">EU</text>
    <rect x="70" y="90" width="180" height="70" rx="35"/><text x="104" y="132" font-size="17" fill="#111" stroke="none">Adultul ales 1</text>
    <rect x="470" y="90" width="180" height="70" rx="35"/><text x="504" y="132" font-size="17" fill="#111" stroke="none">Adultul ales 2</text>
    <rect x="70" y="330" width="180" height="70" rx="35"/><text x="111" y="372" font-size="17" fill="#111" stroke="none">Alt adult sigur</text>
    <rect x="470" y="330" width="180" height="70" rx="35"/><text x="508" y="360" font-size="17" fill="#111" stroke="none">119</text><text x="493" y="382" font-size="13" fill="#111" stroke="none">sau 112 în urgență</text>
    <path d="M310 190L235 150M410 190L485 150M310 290L235 340M410 290L485 340" fill="none"/>
  </g>
  <text x="130" y="445" font-family="Arial, sans-serif" font-size="16">Dacă primul adult nu te ajută, poți vorbi cu altul.</text>
  <text x="25" y="470" font-family="Arial, sans-serif" font-size="11">Instrument pedagogic, nu substitut pentru supravegherea adultului. Sursă conceptuală: UEFA/Terre des hommes.</text>
</svg>
